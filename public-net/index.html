<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>红心对决 · 联网版</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <div id="loginView">
      <h1>红心对决 · 联网版</h1>
      <p class="sub">私人房间 · 四人私玩</p>
      <input id="username" placeholder="用户名" autocomplete="username">
      <input id="password" type="password" placeholder="密码" autocomplete="current-password">
      <button id="loginBtn">登 录</button>
      <p id="loginMsg"></p>
      <p class="tip">朋友账号：erxiao / chendao / wangzong / yuyu / jingge / tingjie / caoyi / guoxiang / niebo / zhangdada / shanliangjiejie / xingfu / pingan，密码 123456</p>
    </div>

    <div id="modeView" class="hidden">
      <h1>红心对决 · 联网版</h1>
      <p class="sub">选择模式开始</p>
      <button id="mode4Btn">4 人模式（一副牌）</button>
      <button id="mode6Btn">6 人模式（两副牌）</button>
      <p class="tip">两种模式房间不互通</p>
    </div>

    <div id="hallView" class="hidden">
      <header class="hallHead">
        <span>欢迎，<b id="me"></b> · <span id="modeLabel"></span></span>
        <button id="modeSwitchBtn" class="ghost">切换模式</button>
        <button id="logoutBtn" class="ghost">退出</button>
      </header>
      <section class="actions">
        <button id="createRoomBtn">创建房间</button>
        <button id="joinRoomBtn">加入房间</button>
      </section>
      <section id="joinPanel" class="panel hidden">
        <input id="joinRoomInput" placeholder="4 位房间号" inputmode="numeric" maxlength="6">
        <button id="joinConfirmBtn">加入</button>
        <button id="joinCancelBtn" class="ghost">取消</button>
      </section>
      <p class="tip" id="hallTip"></p>
      <section class="panel">
        <h3>在线玩家</h3>
        <ul id="onlineList"></ul>
      </section>
    </div>

    <div id="gameView" class="hidden">
      <header class="hallHead">
        <span>第 <b id="gRound"></b> 副 · <span id="gPhase"></span></span>
        <span id="gScore"></span>
        <button id="gLeaveBtn" class="ghost">退出房间</button>
        <button id="gResetBtn" class="ghost">重置</button>
      </header>
      <div id="table">
        <div id="seatTopL" class="seat opponent hidden"></div>
        <div id="seatTop" class="seat opponent"></div>
        <div id="seatTopR" class="seat opponent hidden"></div>
        <div id="seatLeft" class="seat opponent"></div>
        <section id="trick">
          <div id="trickInfo"></div>
          <div id="trickCards"></div>
          <div id="trickResult"></div>
          <div id="bottomBar"></div>
        </section>
        <div id="seatRight" class="seat opponent"></div>
      </div>
      <section id="handArea">
        <div id="handTitle"></div>
        <div id="handCards"></div>
        <div id="actionBar">
          <div id="hint"></div>
          <div id="buttons"></div>
        </div>
      </section>
    </div>

    <div id="roomView" class="hidden">
      <header class="hallHead">
        <span>房间 <b id="roomNum"></b> · <span id="roomMode"></span></span>
        <button id="copyRoomBtn" class="ghost">复制房号</button>
      </header>
      <div id="seats"></div>
      <section class="actions">
        <button id="readyBtn">准备</button>
        <button id="startGameBtn" class="ghost">开始游戏</button>
        <button id="swapBtn" class="ghost">互换 3/4 号位</button>
        <button id="leaveRoomBtn" class="ghost">离开房间</button>
      </section>
      <p class="tip" id="roomTip"></p>
    </div>
  </div>
  <div id="connMsg"></div>
  <div id="rotatePrompt" class="hidden">
    <div class="rotIcon">↻</div>
    <p>请旋转手机横屏游玩</p>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
